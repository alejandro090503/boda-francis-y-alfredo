<!-- INSERTAR: reemplaza <section id="itinerary">…</section> completa (la que va de "5. ITINERARIO" hasta antes de "7. MESA DE REGALOS") -->
<section id="itinerary">
  <span class="lbl">El día de la boda</span>
  <h2 class="ttl">Itinerario</h2>
  <div class="gline"></div>
  <div class="itn-wrap" id="itnWrap">
    <svg class="itn-svg" id="itnSvg" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <linearGradient id="itnGrad" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%"   stop-color="#5e3c08"/>
          <stop offset="14%"  stop-color="#11053b"/>
          <stop offset="34%"  stop-color="#996515"/>
          <stop offset="50%"  stop-color="#FBEDCF"/>
          <stop offset="66%"  stop-color="#996515"/>
          <stop offset="86%"  stop-color="#11053b"/>
          <stop offset="100%" stop-color="#5e3c08"/>
        </linearGradient>
      </defs>
      <path class="itn-bg"   id="itnPathBg"/>
      <path class="itn-halo" id="itnPathHalo"/>
      <path class="itn-beam" id="itnPathBeam"/>
      <path class="itn-path" id="itnPath"/>
      <path class="itn-core" id="itnPathCore"/>
    </svg>
    <div class="itn-pearl" id="itnPearl" aria-hidden="true"></div>

    <div class="itn-row" data-side="left" style="--i:0">
      <div class="itn-orn"></div><div class="itn-pulse"></div><div class="itn-dot"></div>
      <div class="itn-inner"><p class="itn-t">4:30 pm</p><p class="itn-ev">Recepción en la iglesia</p><p class="itn-de">Capilla del Santísimo</p></div>
    </div>
    <div class="itn-row" data-side="right" style="--i:1">
      <div class="itn-orn"></div><div class="itn-pulse"></div><div class="itn-dot"></div>
      <div class="itn-inner"><p class="itn-t">5:00 pm</p><p class="itn-ev">Misa</p><p class="itn-de">Capilla del Santísimo</p></div>
    </div>
    <div class="itn-row" data-side="left" style="--i:2">
      <div class="itn-orn"></div><div class="itn-pulse"></div><div class="itn-dot"></div>
      <div class="itn-inner"><p class="itn-t">6:30 pm</p><p class="itn-ev">Recepción en el salón</p><p class="itn-de">Rancho El Rosario</p></div>
    </div>
    <div class="itn-row" data-side="right" style="--i:3">
      <div class="itn-orn"></div><div class="itn-pulse"></div><div class="itn-dot"></div>
      <div class="itn-inner"><p class="itn-t">Por definir</p><p class="itn-ev">Cena</p></div>
    </div>
    <div class="itn-row" data-side="left" style="--i:4">
      <div class="itn-orn"></div><div class="itn-pulse"></div><div class="itn-dot"></div>
      <div class="itn-inner"><p class="itn-t">Por definir</p><p class="itn-ev">Baile</p></div>
    </div>
  </div>
</section>
