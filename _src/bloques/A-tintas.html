<!-- INSERTAR: una capa .ink-bg como PRIMER hijo de cada <section> listada (justo después de su etiqueta de apertura; ancla única por id).
     Además añadir la clase ink-sec a cada una de esas <section>: id="story", "location", "itinerary", "gifts", "album", "dresscode", "family", "rsvp".
     Ejemplo: <section id="story"> pasa a <section id="story" class="ink-sec"> (si ya trae class, añadir ink-sec al valor existente). -->

<!-- dentro de <section id="story"> -->
<div class="ink-bg" aria-hidden="true"><img src="ink/hero.webp" alt="" loading="lazy" decoding="async" onerror="this.remove()"></div>
<!-- dentro de <section id="location"> -->
<div class="ink-bg ink-bg--flip" aria-hidden="true"><img src="ink/top.webp" alt="" loading="lazy" decoding="async" onerror="this.remove()"></div>
<!-- dentro de <section id="itinerary"> -->
<div class="ink-bg" aria-hidden="true"><img src="ink/corner.webp" alt="" loading="lazy" decoding="async" onerror="this.remove()"></div>
<!-- dentro de <section id="gifts"> (el óvalo queda detrás de las tarjetas de sobres) -->
<div class="ink-bg" aria-hidden="true"><img src="ink/oval.webp" alt="" loading="lazy" decoding="async" onerror="this.remove()"></div>
<!-- dentro de <section id="album"> -->
<div class="ink-bg ink-bg--flip" aria-hidden="true"><img src="ink/footer.webp" alt="" loading="lazy" decoding="async" onerror="this.remove()"></div>
<!-- dentro de <section id="dresscode"> -->
<div class="ink-bg ink-bg--flip" aria-hidden="true"><img src="ink/hero.webp" alt="" loading="lazy" decoding="async" onerror="this.remove()"></div>
<!-- dentro de <section id="family"> -->
<div class="ink-bg" aria-hidden="true"><img src="ink/top.webp" alt="" loading="lazy" decoding="async" onerror="this.remove()"></div>
<!-- dentro de <section id="rsvp"> -->
<div class="ink-bg" aria-hidden="true"><img src="ink/footer.webp" alt="" loading="lazy" decoding="async" onerror="this.remove()"></div>
